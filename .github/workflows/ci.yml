name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' \
            | grep -zv '^third_party/' \
            | xargs -0 clang-format --dry-run --Werror -style=file

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            c_compiler: gcc
            cxx_compiler: g++
            options: ""
          - name: default-clang
            c_compiler: clang
            cxx_compiler: clang++
            options: ""
          - name: abc-cadical
            c_compiler: gcc
            cxx_compiler: g++
            options: "-DBOOP_USE_CADICAL_IN_ABC=ON"
          - name: without-abc-mockturtle
            c_compiler: gcc
            cxx_compiler: g++
            options: "-DBOOP_USE_ABC=OFF -DBOOP_USE_MOCKTURTLE=OFF"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libreadline-dev

      - name: Configure
        run: |
          CC=${{ matrix.c_compiler }} CXX=${{ matrix.cxx_compiler }} \
            cmake -S . -B build/${{ matrix.name }} -DCMAKE_BUILD_TYPE=Release ${{ matrix.options }}

      - name: Build
        run: cmake --build build/${{ matrix.name }} --parallel 2

      - name: Test
        run: ctest --test-dir build/${{ matrix.name }} --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr libreadline-dev

      - name: Configure
        run: cmake -S . -B build/coverage -DCMAKE_BUILD_TYPE=Debug -DBOOP_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build/coverage --parallel 2

      - name: Test
        run: ctest --test-dir build/coverage --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            --object-directory build/coverage \
            --filter include/boop \
            --filter src \
            --filter programs \
            --exclude third_party \
            --print-summary \
            --xml-pretty --xml build/coverage/coverage.xml \
            --html-details build/coverage/coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/coverage.xml
          flags: smoke
          name: boop
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage/coverage.xml
            build/coverage/coverage*.html
